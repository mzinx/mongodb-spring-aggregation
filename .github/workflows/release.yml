name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        options: [patch, minor, major]
        default: patch
jobs:
  release:
    permissions:
      contents: write
    uses: mzinx/workflows/.github/workflows/maven-release.yml@v1
    with:
      bump: ${{ inputs.bump }}
    secrets: inherit
